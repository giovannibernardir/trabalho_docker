services:
  web:
    build: .  # Aqui nós mudamos de "image:" para "build: ."
    container_name: brawl_stars_php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/
  db:
    image: mysql:8.0
    container_name: brawl_stars_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brawldex
    ports:
      - "3307:3306"